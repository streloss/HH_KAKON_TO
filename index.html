<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>HH_KAKON_TO — Официальный сайт</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #1c1c1c);
      color: white;
    }
    header {
      padding: 40px 20px;
      text-align: center;
    }
    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }
    header p {
      font-size: 18px;
      color: #cccccc;
    }
    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 20px auto;
      overflow: hidden;
      border: 4px solid #ff0050;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    section {
      padding: 30px 20px;
      max-width: 900px;
      margin: auto;
    }
    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      background: #111;
      border-radius: 16px;
      padding: 20px;
      min-width: 200px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .card h2 {
      margin: 0;
      font-size: 32px;
      color: #ff0050;
    }
    .card p {
      margin: 5px 0 0;
      color: #aaa;
    }
    .buttons {
      text-align: center;
      margin-top: 30px;
    }
    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 14px 26px;
      border-radius: 30px;
      background: #ff0050;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }
    .buttons a:hover {
      transform: scale(1.05);
      background: #ff2b6a;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

<header>
  <div class="avatar">
    <img src="avatar.jpeg" alt="Аватар">
  </div>
  <h1>@HH_KAKON_TO</h1>
  <p>Мемы • Развлечения • Шипы • Арты</p>
</header>

<section>
  <div class="stats">
    <div class="card">
      <h2>2169</h2>
      <p>Подписчиков</p>
    </div>
    <div class="card">
      <h2>59.3K</h2>
      <p>Лайков</p>
    </div>
    <div class="card">
      <h2>24</h2>
      <p>Видео</p>
    </div>
  </div>

  <div class="buttons">
    <a href="https://www.tiktok.com/@hh_kakon_to_lk" target="_blank">TikTok</a>
    <a href="https://t.me/HH_KAKON_TO_XD" target="_blank">Telegram</a>
  </div>
</section>

<footer>
  привет!!!
</footer>

</body>
</html>
