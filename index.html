    body {

      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #1c1c1c);
      color: white;
      animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    header {
      padding: 40px 20px;
      text-align: center;
      animation: slideDown 1s ease-out;
    }
    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }
    header p {
      font-size: 18px;
      color: #cccccc;
    }
    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 20px auto;
      overflow: hidden;
      border: 4px solid #ff0050;
      animation: zoomIn 1s ease;
    }
    @keyframes zoomIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    section {
      padding: 30px 20px;
      max-width: 900px;
      margin: auto;
      animation: fadeUp 1.2s ease;
    }
    @keyframes fadeUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      background: #111;
      border-radius: 16px;
      padding: 20px;
      min-width: 200px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .card h2 {
      margin: 0;
      font-size: 32px;
      color: #ff0050;
    }
    .card p {
      margin: 5px 0 0;
      color: #aaa;
    }
    .buttons {
      text-align: center;
      margin-top: 30px;
    }
    .buttons a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 10px;
      padding: 14px 26px;
      border-radius: 30px;
      background: #ff0050;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }
    .buttons a:hover {
      transform: scale(1.08);
      background: #ff2b6a;
    }
    .buttons svg {
      width: 20px;
      height: 20px;
      fill: white;
    }
    footer {

      padding: 20px;
